# ===================================================================
# Database Configuration for Student DBMS Project (Oracle Database)
# ===================================================================

# Oracle JDBC Driver Class (Type 4 Thin Driver)
db.driver=oracle.jdbc.OracleDriver

# Connection URL for Oracle Database:
# - For Oracle 11g Express Edition (XE): jdbc:oracle:thin:@localhost:1521:xe
# - For Oracle 19c / 21c (PDB):          jdbc:oracle:thin:@localhost:1521/XEPDB1 or orcl
db.url=jdbc:oracle:thin:@localhost:1521:xe

# Database Credentials:
# Change 'user' and 'password' below to match your Oracle setup.
# (Common defaults in college labs: system/oracle, system/manager, system/admin, scott/tiger)
db.user=system
db.password=oracle
